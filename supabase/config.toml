# ─── Supabase project configuration ──────────────────────────────────────────
# Supabase CLI reads this file. Run `supabase start` to boot a local stack.
# Reference: https://supabase.com/docs/guides/cli/config

[project]
project_id = "your-project-ref"   # replace with your actual project ref

# ─── API ─────────────────────────────────────────────────────────────────────
[api]
enabled = true
port    = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

# ─── Database ────────────────────────────────────────────────────────────────
[db]
port     = 54322
pooler_port = 54329
major_version = 15

# ─── Studio ──────────────────────────────────────────────────────────────────
[studio]
enabled = true
port    = 54323

# ─── Auth ────────────────────────────────────────────────────────────────────
[auth]
enabled  = true
site_url = "http://localhost:3000"

# ─── Cron Schedules ─────────────────────────────────────────────────────────────
[cron.process-decay]
schedule = "*/15 * * * *"
